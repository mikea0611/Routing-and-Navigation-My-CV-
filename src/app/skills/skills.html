<section class="content-card skills-section">
  <div class="section-heading">
    <h2>KEY SKILLS</h2>
  </div>

  <div class="skills-grid">
    @for (skill of skills(); track skill) {
      <button
        type="button"
        class="skill-item"
        (click)="selectSkill(skill)">
        {{ skill }}
      </button>
    }
  </div>
</section>
