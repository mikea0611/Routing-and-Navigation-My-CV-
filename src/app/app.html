<main class="resume">
  <div class="about-grid">
    <app-header
      [fullName]="fullName"
      [location]="location"
      [email]="email"
      [phone]="phone"
      [profile]="profile" />

    <app-profile-card />
  </div>

  <app-skills
    [skills]="skills"
    (skillSelected)="onSkillSelected($event)" />

  <section class="content-card interaction">
    <div class="section-heading">
      <h2>ANGULAR INTERACTION</h2>
    </div>
    <p>{{ message }}</p>
  </section>

  <app-footer
    [fullName]="fullName"
    [proficiencies]="proficiencies" />
</main>
